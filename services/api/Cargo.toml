[package]
name = "studio-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
db-core.workspace = true
db-types.workspace = true
db-postgres.workspace = true
db-mysql.workspace = true
query-runtime = { path = "../../crates/query-runtime" }
sqlx.workspace = true
tokio = { workspace = true, features = ["net", "fs"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
futures-util.workspace = true
chrono.workspace = true
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.11", features = ["limit", "request-id"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rand = "=0.8.5"
zeroize = "=1.8.2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
subtle = "=2.6.1"
jsonwebtoken = { version = "=9.3.1", default-features = false }
url = "=2.5.8"
ipnet = { version = "=2.12.2", features = ["serde"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.19", features = ["json"] }

[dev-dependencies]
tempfile = "=3.20.0"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"

[features]
test-provider = []
