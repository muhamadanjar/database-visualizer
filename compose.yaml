name: database-studio-foundation
services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_USER: studio_admin
      POSTGRES_PASSWORD: ${STUDIO_TEST_PASSWORD:-studio_test}
      POSTGRES_DB: studio_test
    ports: ["127.0.0.1:${STUDIO_PG_PORT:-55432}:5432"]
    volumes: ["./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-user.sh:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_admin -d studio_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4@sha256:da906917ca4ace3ba55538b7c2ee97a9bc865ef14a4b6920b021f0249d603f3d
    environment:
      MYSQL_ROOT_PASSWORD: ${STUDIO_TEST_PASSWORD:-studio_test}
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${STUDIO_TEST_PASSWORD:-studio_test}
      MYSQL_DATABASE: studio_test
    ports: ["127.0.0.1:${STUDIO_MYSQL_PORT:-53306}:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
  application-postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_USER: studio_app
      POSTGRES_PASSWORD: ${STUDIO_TEST_PASSWORD:-studio_test}
      POSTGRES_DB: studio_app
    ports: ["127.0.0.1:${STUDIO_APP_PORT:-55433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_app -d studio_app"]
      interval: 2s
      timeout: 3s
      retries: 30
