name: Native platform acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    # Dedicated runners need the disposable Compose fixtures and an interactive
    # desktop with an unlocked OS credential store. No production DB credentials.
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows, macOS]
    runs-on: [self-hosted, '${{ matrix.os }}', database-studio-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: pnpm install --frozen-lockfile
      - run: cargo run -p desktop-runtime --example credential_probe --locked
      - run: pnpm test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: test-results/
