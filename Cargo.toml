[workspace]
exclude = ["vendor/sqlx-postgres", "vendor/sqlx-mysql"]
members = ["crates/query-runtime", "services/api", "crates/db-types", "crates/db-core", "crates/db-postgres", "crates/db-mysql", "crates/desktop-runtime", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "=0.1.89"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "=0.7.15"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
futures-util = "=0.3.31"
chrono = { version = "=0.4.45", features = ["serde"] }
bigdecimal = "=0.4.10"
sqlparser = "=0.63.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "chrono", "bigdecimal", "json", "uuid"] }
db-types = { path = "crates/db-types" }
db-core = { path = "crates/db-core" }
db-postgres = { path = "crates/db-postgres" }
db-mysql = { path = "crates/db-mysql" }

[patch.crates-io]
sqlx-postgres = { path = "vendor/sqlx-postgres" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }
