name: database-studio-web
services:
  application-postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_USER: studio_app
      POSTGRES_DB: studio_app
      POSTGRES_PASSWORD_FILE: /run/secrets/application-password
    volumes:
      - ${STUDIO_OPERATOR_DIRECTORY:?set operator directory}/application-password:/run/secrets/application-password:ro
      - application-data:/var/lib/postgresql/data
    networks:
      control:
        ipv4_address: 172.30.1.2
    healthcheck:
      test: [CMD-SHELL, pg_isready -U studio_app -d studio_app]
      interval: 2s
      timeout: 3s
      retries: 30
  egress:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile.egress
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${STUDIO_OPERATOR_DIRECTORY}/targets.json:/policy/targets.json:ro
    networks: [ingress, control, outbound]
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 2s
      timeout: 1s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile.api
    network_mode: service:egress
    env_file: ${STUDIO_OPERATOR_DIRECTORY}/api.env
    environment:
      STUDIO_API_BIND: 0.0.0.0:8080
      STUDIO_KEY_FILE: /operator/keys.json
      STUDIO_TARGET_POLICY_FILE: /operator/targets.json
      STUDIO_SPOOL_DIRECTORY: /results
    volumes:
      - ${STUDIO_OPERATOR_DIRECTORY}:/operator:ro
      - results:/results
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    depends_on:
      application-postgres: {condition: service_healthy}
      egress: {condition: service_healthy}
  migrate:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile.api
    command: [migrate]
    profiles: [maintenance]
    env_file: ${STUDIO_OPERATOR_DIRECTORY}/api.env
    networks: [control]
    cap_drop: [ALL]
    read_only: true
    depends_on:
      application-postgres: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile.frontend
    ports: ["443:8443"]
    volumes:
      - ${STUDIO_OPERATOR_DIRECTORY}/tls:/tls:ro
    networks: [ingress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
networks:
  ingress: {internal: true}
  control:
    internal: true
    ipam:
      config: [{subnet: 172.30.1.0/24}]
  outbound: {}
volumes:
  application-data: {}
  results: {}
