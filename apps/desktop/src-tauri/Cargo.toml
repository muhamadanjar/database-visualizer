[package]
name = "database-studio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
desktop-runtime = { path = "../../../crates/desktop-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
db-types.workspace = true
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
